# Development Profile Configuration
# All sensitive credentials must come from environment variables.
# This file provides development placeholders only.

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:subscription_tracker}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:your_mailtrap_user}
    password: ${MAIL_PASSWORD:your_mailtrap_password}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000

app:
  notifications:
    enabled: ${NOTIFICATION_ENABLED:true}
    cron: ${NOTIFICATION_CRON:0 0 9 * * ?}
    renewal-days-before: ${RENEWAL_REMINDER_DAYS:3}
    trial-days-before: ${TRIAL_REMINDER_DAYS:1}
    from-email: ${MAIL_FROM:notifications@subscriptiontracker.com}
