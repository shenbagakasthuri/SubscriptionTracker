spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:subscription_tracker}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: "dummy_test_jwt_secret_key_minimum_32_chars_long_12345"
  expiration-ms: 3600000

app:
  notifications:
    enabled: false
    cron: "0 0 9 * * ?"
    renewal-days-before: 3
    trial-days-before: 1
    from-email: "test@subscriptiontracker.com"
